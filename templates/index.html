<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鋼琴五線譜手動擷取工具</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>🎹 鋼琴五線譜手動擷取工具</h1>
    <p class="sub">上傳教學影片，手動拉動時間軸擷取需要的樂譜片段，拼成完整樂譜 PDF。</p>

    <!-- Step 1: 上傳 -->
    <section id="step-upload" class="card">
      <h2>1. 提供影片</h2>
      <div class="tabbar">
        <button type="button" id="tabFile" class="tab-btn active">上傳檔案</button>
        <button type="button" id="tabUrl" class="tab-btn">貼上網址</button>
      </div>

      <div id="panelFile">
        <div id="dropzone" class="dropzone">
          <p>把影片拖曳到這裡，或點擊選擇檔案</p>
          <input type="file" id="fileInput" accept="video/*">
        </div>
      </div>

      <div id="panelUrl" class="hidden">
        <div class="row">
          <input type="text" id="urlInput" placeholder="貼上影片網址 (例如 YouTube / Bilibili 影片連結)" style="flex:1;">
          <button id="urlSubmitBtn">下載影片</button>
        </div>
        <p class="hint">請確保你有權利下載與使用這部影片，僅供個人練習/教學用途；下載內容的版權責任由使用者自行負責。</p>
      </div>

      <div id="uploadStatus" class="hint"></div>
    </section>

    <!-- Step 2: 框選與擷取 -->
    <section id="step-crop" class="card hidden">
      <h2>2. 手動擷取樂譜片段</h2>
      <p class="hint">請拖曳下方時間軸找到樂譜畫面，並調整綠色框選範圍，確認後點擊「擷取當前畫面」。可以重複此動作擷取多張片段。</p>
      <div id="cropStage" class="crop-stage">
        <img id="previewImg" src="" alt="preview">
        <div id="cropBox" class="crop-box">
          <div class="handle nw"></div><div class="handle ne"></div>
          <div class="handle sw"></div><div class="handle se"></div>
        </div>
      </div>
      <div class="row">
        <label>影片時間點：</label>
        <input type="range" id="previewSeek" min="0" max="100" value="0" step="0.1">
        <span id="previewSeekLabel">0.0 秒</span>
      </div>
      <div class="row" style="justify-content: center; gap: 12px; margin-top: 8px;">
        <button type="button" id="btnSeekM1" class="tab-btn">-1 秒</button>
        <button type="button" id="btnSeekM05" class="tab-btn">-0.5 秒</button>
        <button type="button" id="btnSeekP05" class="tab-btn">+0.5 秒</button>
        <button type="button" id="btnSeekP1" class="tab-btn">+1 秒</button>
      </div>
      <div class="row" style="justify-content: center; margin-top: 16px;">
        <button id="captureBtn" class="primary" style="font-size: 16px;">📸 擷取當前畫面</button>
      </div>

      <!-- Gallery -->
      <div id="galleryWrap" class="hidden" style="margin-top: 24px;">
        <h3>已擷取的片段 (<span id="galleryCount">0</span>)</h3>
        <div id="gallery" class="gallery"></div>
      </div>
    </section>

    <!-- Step 3: 參數與輸出 -->
    <section id="step-params" class="card hidden">
      <h2>3. 輸出設定與產生 PDF</h2>
      <div class="grid">
        <label>樂譜標題
          <input type="text" id="titleInput" value="鋼琴五線譜">
        </label>
        <label>副標題（選填）
          <input type="text" id="subtitleInput" value="" placeholder="例如：cover○○・改編：○○">
        </label>
        <label>紙張大小
          <select id="pageSizeInput">
            <option value="A4">A4</option>
            <option value="Letter">Letter</option>
          </select>
        </label>
      </div>

      <div class="row" style="margin-bottom: 8px;">
        <label class="checkbox-label">
          <input type="checkbox" id="enhanceInput" checked>
          啟用智慧畫質增強 (自動調整對比、柔和銳化，讓樂譜更清晰且保留細節)
        </label>
        <button type="button" id="enhancePreviewBtn">👀 預覽增強效果</button>
      </div>
      <div id="enhancePreviewWrap" class="hidden" style="margin-bottom: 24px;">
        <p class="hint">這是目前框選區域套用智慧增強後的樣子：</p>
        <img id="enhancePreviewImg" src="" alt="增強預覽" style="max-width:100%;border:1px solid var(--border);border-radius:6px;">
      </div>

      <button id="startBtn" class="primary">🚀 產生樂譜 PDF</button>
    </section>

    <!-- Step 4: 進度 -->
    <section id="step-progress" class="card hidden">
      <h2 id="stepProgressTitle">處理中...</h2>
      <div class="progress-outer"><div id="progressBar" class="progress-inner"></div></div>
      <div id="progressMsg" class="hint"></div>
    </section>

    <!-- Step 5: 結果 -->
    <section id="step-result" class="card hidden">
      <h2>✅ 完成！</h2>
      <p id="resultSummary"></p>
      <a id="downloadBtn" class="primary" href="#" download>⬇️ 下載樂譜 PDF</a>
      <button id="restartBtn">重新開始</button>
    </section>

    <div id="errorBox" class="error hidden"></div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" class="modal hidden">
    <span id="imageModalClose" class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
